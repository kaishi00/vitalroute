name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: Validate and build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Validate repository and project
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s .gitignore

          PROJECT="$(find . -maxdepth 3 -type d -name '*.xcodeproj' -not -path './.git/*' -print -quit)"
          if [[ -z "$PROJECT" ]]; then
            echo "No Xcode project is present yet; repository validation passed. Build and tests will run once the project is added."
            echo "project_present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "project_present=true" >> "$GITHUB_OUTPUT"
          echo "project_path=$PROJECT" >> "$GITHUB_OUTPUT"
          plutil -lint "$PROJECT/project.pbxproj"

          PROJECT_INFO="$(mktemp)"
          trap 'rm -f "$PROJECT_INFO"' EXIT
          xcodebuild -list -json -project "$PROJECT" > "$PROJECT_INFO"
          SCHEME="$(basename "$PROJECT" .xcodeproj)"
          if ! jq -e --arg scheme "$SCHEME" '.project.schemes | index($scheme) != null' "$PROJECT_INFO" >/dev/null; then
            echo "::error::Expected a shared Xcode scheme named '$SCHEME'. Available schemes:"
            jq -r '.project.schemes[]' "$PROJECT_INFO"
            exit 1
          fi
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

          if jq -e '.project.targets[] | select(test("Tests$"; "i"))' "$PROJECT_INFO" >/dev/null; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build for iOS Simulator
        if: steps.inspect.outputs.project_present == 'true'
        env:
          PROJECT_PATH: ${{ steps.inspect.outputs.project_path }}
          IOS_SCHEME: ${{ steps.inspect.outputs.scheme }}
        run: >-
          xcodebuild -project "$PROJECT_PATH" -scheme "$IOS_SCHEME"
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

      - name: Run XCTest targets
        if: steps.inspect.outputs.project_present == 'true' && steps.inspect.outputs.has_tests == 'true'
        env:
          PROJECT_PATH: ${{ steps.inspect.outputs.project_path }}
          IOS_SCHEME: ${{ steps.inspect.outputs.scheme }}
        run: >-
          xcodebuild -project "$PROJECT_PATH" -scheme "$IOS_SCHEME"
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          CODE_SIGNING_ALLOWED=NO test

  server:
    name: Receiver tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run receiver tests
        run: python3 -m unittest discover -s server/tests -v

      - name: Package receiver image and smoke-test the compose stack
        env:
          COMPOSE_FILE_PATH: ${{ github.workspace }}/server/deploy/docker-compose.yml
        run: |
          set -euo pipefail
          hdr=""
          cleanup() {
            rm -f "$hdr" /tmp/vr-ci-token || true
            sudo rm -rf /tmp/vr-ci-data || true
            docker compose -p vr-ci -f "$COMPOSE_FILE_PATH" down -v || true
          }
          trap cleanup EXIT
          # Validate the packaging scripts (bash -n takes ONE file; a list
          # would silently check only the first).
          for s in server/deploy/install.sh server/deploy/backup.sh server/deploy/restore.sh; do
            bash -n "$s"
          done
          # Privacy invariant: the backend must be published to host
          # loopback only. `docker compose config` normalizes short-syntax
          # ports to long form where the bind address lands in `host_ip`
          # and `published` holds only the port — match the rendered
          # host_ip, captured first so grep cannot SIGPIPE the producer.
          cfg="$(VITALROUTE_TOKEN_FILE=/tmp/placeholder docker compose -f "$COMPOSE_FILE_PATH" config)" ||
            { echo "::error::docker compose config failed"; exit 1; }
          grep -qE 'host_ip: 127\.0\.0\.1' <<<"$cfg" ||
            { echo "::error::backend port is not loopback-only"; exit 1; }
          if grep -qE 'host_ip: (0\.0\.0\.0|::)' <<<"$cfg"; then
            echo "::error::a service is published on a non-loopback address"; exit 1
          fi
          # Create the token with PRODUCTION permissions (owned by the
          # container UID 64000, mode 0400) so a permission regression in
          # the secret handling fails here, not on a real host.
          python3 -c "import secrets; print(secrets.token_urlsafe(32), end='')" > /tmp/vr-ci-token
          sudo chown 64000:64000 /tmp/vr-ci-token
          sudo chmod 400 /tmp/vr-ci-token
          # Build, start, and wait for the container health check, then
          # prove both auth outcomes against the loopback backend. The
          # bearer token is passed via a curl config file, never argv.
          cd server/deploy
          VITALROUTE_TOKEN_FILE=/tmp/vr-ci-token docker compose -p vr-ci -f "$COMPOSE_FILE_PATH" up -d --build --wait --wait-timeout 180
          hdr="$(mktemp)"
          printf 'header = "Authorization: Bearer %s"\n' "$(sudo cat /tmp/vr-ci-token)" >"$hdr"
          code="$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8790/v1/health)"
          [ "$code" = "401" ] || { echo "::error::unauthenticated /v1/health returned $code, expected 401"; exit 1; }
          code="$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' -K "$hdr" http://127.0.0.1:8790/v1/health)"
          [ "$code" = "200" ] || { echo "::error::authenticated /v1/health returned $code, expected 200"; exit 1; }
          rm -f "$hdr" && hdr=""
          # Round-trip a backup against the live stack (synthetic database;
          # the stack has received no data, so it must report zero rows).
          # Output is captured first: grep -q in a pipe would close early
          # and take the still-writing script down with SIGPIPE.
          out="$(cd "$GITHUB_WORKSPACE/server/deploy" && sudo -E env \
            VITALROUTE_PROJECT_NAME=vr-ci VITALROUTE_DATA_DIR=/tmp/vr-ci-data \
            bash backup.sh /tmp/vr-ci-data/backups)" ||
            { echo "::error::backup.sh failed"; exit 1; }
          echo "$out"
          grep -q 'backup ok: 0 records, 0 tombstones' <<<"$out" ||
            { echo "::error::unexpected backup summary"; exit 1; }
